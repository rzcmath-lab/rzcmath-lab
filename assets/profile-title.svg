<svg xmlns="http://www.w3.org/2000/svg" width="900" height="96" viewBox="0 0 900 96" role="img" aria-labelledby="title desc">
  <title id="title">Ruizhi Zhang, AI Agent Engineer</title>
  <desc id="desc">Hi, I am Ruizhi Zhang, an AI Agent Engineer</desc>
  <defs>
    <linearGradient id="titleShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24292f"/>
      <stop offset="0.40" stop-color="#24292f"/>
      <stop offset="0.50" stop-color="#0969da"/>
      <stop offset="0.60" stop-color="#24292f"/>
      <stop offset="1" stop-color="#24292f"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .name { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -.35px; }
      .role { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.6px; }
    </style>
  </defs>
  <text class="name" x="450" y="35" text-anchor="middle" fill="url(#titleShine)">Hi, I'm Ruizhi Zhang · 张睿志</text>
  <text class="role" x="450" y="70" text-anchor="middle" fill="#0969da">AI AGENT ENGINEER</text>
  <rect x="394" y="84" width="112" height="2" rx="1" fill="#0969da">
    <animate attributeName="x" values="394;428;394" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="width" values="112;44;112" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".25;.95;.25" dur="4.8s" repeatCount="indefinite"/>
  </rect>
</svg>
